name: Build and Release Unity Game

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

env:
  UNITY_VERSION: 6000.3.6f1
  BUILD_PATH: build/Windows
  BUILD_NAME: Minge2026Spring_Team4

jobs:
  build:
    name: Build Windows player
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: ${{ env.BUILD_PATH }}

      - name: Package build
        run: |
          cd "${BUILD_PATH}"
          zip -r "../${BUILD_NAME}-Windows.zip" .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/${{ env.BUILD_NAME }}-Windows.zip
