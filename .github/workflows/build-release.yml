name: Build and Release Unity Game

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

env:
  UNITY_VERSION: 6000.3.6f1
  BUILD_PATH: build/Windows
  BUILD_NAME: Minge2026Spring_Team4

jobs:
  build:
    name: Build Windows player
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # UnityのDockerイメージを展開するための空き容量を確保
      - name: Free disk space
        shell: bash
        run: |
          echo "=== Disk space before cleanup ==="
          df -h

          # Windows向けUnityビルドでは使用しない大容量ツールを削除
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          # Runnerにプリインストールされた不要なDockerイメージを削除
          docker system prune --all --force || true

          sudo apt-get clean

          echo "=== Disk space after cleanup ==="
          df -h

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: ${{ env.BUILD_PATH }}

      - name: Show build output
        run: |
          echo "=== Build output ==="
          find "${BUILD_PATH}" -maxdepth 3 -type f | head -100
          df -h

      - name: Package build
        shell: bash
        run: |
          cd "${BUILD_PATH}"
          zip -r "../${BUILD_NAME}-Windows.zip" .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/${{ env.BUILD_NAME }}-Windows.zip